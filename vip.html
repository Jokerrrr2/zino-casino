<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zino - Programme VIP</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root {
            --bg-main: #0F212E; --bg-panel: #1A2C38; --bg-card: #1A2C38;
            --bg-hover: #253B4A; --text-main: #FFFFFF; --text-muted: #B1BAD3;
            --border-color: #2F4553;
            --zino-orange: #FFA94D; --zino-orange-dark: #FF922B;
            --success: #00E701; --danger: #FF4D4D;
            /* Rangs VIP */
            --rank-bronze: #CD7F32;
            --rank-silver: #C0C0C0;
            --rank-gold: #FFD700;
            --rank-platinum: #00CED1;
            --rank-diamond: #B9F2FF;
            --rank-legend: #FF1493;
        }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 20px; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-panel); padding: 12px 20px; height: 60px;
            border-bottom: 1px solid var(--border-color); border-radius: 10px;
            margin-bottom: 25px;
        }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: -1px; color: var(--zino-orange); text-decoration: none; }
        .logo span { color: white; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .balance-display { font-size: 15px; font-weight: 700; color: var(--zino-orange); }
        .back-btn { background: var(--bg-hover); color: white; border: none; padding: 8px 14px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .back-btn:hover { background: #2F4553; }

        .container { max-width: 1100px; margin: 0 auto; }

        /* HEADER DE PAGE */
        .page-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .page-header h1 {
            font-size: 34px;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .page-header h1 .highlight { color: var(--zino-orange); }
        .page-header p { font-size: 15px; color: var(--text-muted); }

        /* CARTE DE PROGRESSION PERSONNELLE */
        .my-rank-card {
            background: linear-gradient(135deg, #1A2C38 0%, #253B4A 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        .my-rank-card::before {
            content: '';
            position: absolute;
            top: -50%; right: -10%;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255,169,77,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .my-rank-content {
            display: flex;
            align-items: center;
            gap: 25px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .rank-badge {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            background: radial-gradient(circle at 30% 30%, #C9A961 0%, #8B6B3F 60%, #5C4423 100%);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5), inset 0 3px 8px rgba(255,255,255,0.2);
            flex-shrink: 0;
            position: relative;
        }
        .rank-badge.bronze { background: radial-gradient(circle at 30% 30%, #E8A55A 0%, #CD7F32 60%, #8B4513 100%); }
        .rank-badge.silver { background: radial-gradient(circle at 30% 30%, #F5F5F5 0%, #C0C0C0 60%, #808080 100%); }
        .rank-badge.gold { background: radial-gradient(circle at 30% 30%, #FFED4E 0%, #FFD700 60%, #B8860B 100%); }
        .rank-badge.platinum { background: radial-gradient(circle at 30% 30%, #E0FFFF 0%, #00CED1 60%, #008B8B 100%); }
        .rank-badge.diamond { background: radial-gradient(circle at 30% 30%, #FFFFFF 0%, #B9F2FF 60%, #00BFFF 100%); }
        .rank-badge.legend { background: radial-gradient(circle at 30% 30%, #FF69B4 0%, #FF1493 60%, #8B0064 100%); }

        .my-rank-info { flex: 1; }
        .my-rank-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
        .my-rank-name { font-size: 32px; font-weight: 900; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .my-rank-name .tag {
            font-size: 11px;
            background: var(--zino-orange);
            color: #000;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .my-rank-wagered { font-size: 14px; color: var(--text-muted); }
        .my-rank-wagered strong { color: var(--zino-orange); font-weight: 800; }

        /* PROGRESSION VERS LE PROCHAIN RANG */
        .next-rank-bar {
            margin-top: 20px;
            position: relative;
            z-index: 1;
        }
        .next-rank-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .next-rank-labels .current { color: white; }
        .next-rank-labels .next { color: var(--zino-orange); }

        .progress-bar-track {
            height: 14px;
            background: var(--bg-main);
            border-radius: 7px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--zino-orange) 0%, #FFD700 100%);
            border-radius: 7px;
            transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 15px rgba(255, 169, 77, 0.5);
            position: relative;
        }
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
            animation: shine 2s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .next-rank-percent {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .next-rank-percent strong { color: var(--zino-orange); font-weight: 900; font-size: 15px; }

        /* GRILLE DES RANGS */
        .ranks-section {
            margin-top: 40px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title::before {
            content: '';
            width: 5px;
            height: 24px;
            background: var(--zino-orange);
            border-radius: 3px;
        }

        .ranks-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .rank-card {
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .rank-card:hover { transform: translateY(-4px); }
        .rank-card.current {
            border-color: var(--zino-orange);
            box-shadow: 0 0 30px rgba(255, 169, 77, 0.3);
        }
        .rank-card.current::before {
            content: '★ ACTUEL';
            position: absolute;
            top: 12px; right: 12px;
            background: var(--zino-orange);
            color: #000;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
        .rank-card.locked {
            opacity: 0.5;
        }

        .rank-card-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 12px;
        }
        .rank-card-icon.bronze { background: rgba(205, 127, 50, 0.15); }
        .rank-card-icon.silver { background: rgba(192, 192, 192, 0.15); }
        .rank-card-icon.gold { background: rgba(255, 215, 0, 0.15); }
        .rank-card-icon.platinum { background: rgba(0, 206, 209, 0.15); }
        .rank-card-icon.diamond { background: rgba(185, 242, 255, 0.15); }
        .rank-card-icon.legend { background: rgba(255, 20, 147, 0.15); }

        .rank-card-name {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 4px;
        }
        .rank-card-name.bronze { color: var(--rank-bronze); }
        .rank-card-name.silver { color: var(--rank-silver); }
        .rank-card-name.gold { color: var(--rank-gold); }
        .rank-card-name.platinum { color: var(--rank-platinum); }
        .rank-card-name.diamond { color: var(--rank-diamond); }
        .rank-card-name.legend { color: var(--rank-legend); }

        .rank-card-wager {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 14px;
            font-weight: 600;
        }
        .rank-card-wager strong { color: white; }

        .rank-card-perks {
            list-style: none;
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
        }
        .rank-card-perks li {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            padding: 5px 0;
            color: var(--text-muted);
            font-weight: 600;
        }
        .rank-card-perks li .check {
            color: var(--success);
            font-weight: 900;
            flex-shrink: 0;
        }
        .rank-card-perks li.locked-perk {
            opacity: 0.4;
        }
        .rank-card-perks li.locked-perk .check {
            color: var(--text-muted);
        }

        /* NOT LOGGED IN */
        .not-logged {
            background: var(--bg-panel);
            border-radius: 16px;
            padding: 60px 30px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .not-logged .icon { font-size: 64px; margin-bottom: 20px; }
        .not-logged h2 { font-size: 24px; margin-bottom: 10px; }
        .not-logged p { color: var(--text-muted); margin-bottom: 25px; }
        .not-logged a {
            background: var(--zino-orange);
            color: #000;
            padding: 14px 30px;
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }

        /* CONFETTIS */
        .confetti-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
            display: none;
        }
        .confetti-container.active { display: block; }
        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            animation: confettiFall 3s linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .ranks-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .page-header h1 { font-size: 24px; }
            .my-rank-content { flex-direction: column; text-align: center; }
            .my-rank-name { justify-content: center; }
            .rank-badge { width: 80px; height: 80px; font-size: 40px; }
            .my-rank-name { font-size: 24px; }
            .ranks-grid { grid-template-columns: 1fr; }
            .balance-display { font-size: 13px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Zino<span>.bet</span></a>
        <div class="header-right">
            <div class="balance-display">Solde : <span id="headerBalance">--</span> €</div>
            <a href="index.html" class="back-btn">← Accueil</a>
        </div>
    </header>

    <div class="container" id="app"></div>

    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        // ============================================================
        // ZINO AUTH - Module intégré
        // ============================================================
        const ZinoAuth = (() => {
            const USERS_KEY = 'zino_users_v1';
            const SESSION_KEY = 'zino_session_v1';
            function init() { if (!localStorage.getItem(USERS_KEY)) localStorage.setItem(USERS_KEY, JSON.stringify({})); }
            function hashPassword(password) {
                const salt = 'zino_salt_2026_xoxo';
                const combined = salt + password + salt;
                let hash = 0;
                for (let i = 0; i < combined.length; i++) {
                    const char = combined.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return 'h_' + Math.abs(hash).toString(36);
            }
            function register(email, password, username) {
                init();
                email = email.toLowerCase().trim();
                if (!email || !email.includes('@')) return { success: false, error: 'Email invalide' };
                if (!password || password.length < 4) return { success: false, error: 'Mot de passe trop court' };
                if (!username || username.trim().length < 2) return { success: false, error: 'Pseudo trop court' };
                const users = JSON.parse(localStorage.getItem(USERS_KEY));
                if (users[email]) return { success: false, error: 'Cet email est déjà utilisé' };
                const newUser = {
                    email, username: username.trim(), passwordHash: hashPassword(password),
                    balance: 1000, createdAt: Date.now(),
                    stats: { totalWagered: 0, totalProfit: 0, gamesPlayed: 0, wins: 0, losses: 0 },
                    transactions: [{ type: 'welcome', amount: 1000, date: Date.now(), description: 'Bonus de bienvenue 🎁' }],
                    vip: { claimedBonuses: [] }
                };
                users[email] = newUser;
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
                localStorage.setItem(SESSION_KEY, email);
                return { success: true, user: newUser };
            }
            function login(email, password) {
                init();
                email = email.toLowerCase().trim();
                const users = JSON.parse(localStorage.getItem(USERS_KEY));
                const user = users[email];
                if (!user) return { success: false, error: 'Aucun compte avec cet email' };
                if (user.passwordHash !== hashPassword(password)) return { success: false, error: 'Mot de passe incorrect' };
                localStorage.setItem(SESSION_KEY, email);
                return { success: true, user };
            }
            function logout() { localStorage.removeItem(SESSION_KEY); }
            function getCurrentUser() {
                init();
                const email = localStorage.getItem(SESSION_KEY);
                if (!email) return null;
                const users = JSON.parse(localStorage.getItem(USERS_KEY));
                return users[email] || null;
            }
            function isLoggedIn() { return getCurrentUser() !== null; }
            function updateUser(updates) {
                const email = localStorage.getItem(SESSION_KEY);
                if (!email) return false;
                const users = JSON.parse(localStorage.getItem(USERS_KEY));
                if (!users[email]) return false;
                users[email] = { ...users[email], ...updates };
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
                return true;
            }
            function getBalance() { const u = getCurrentUser(); return u ? u.balance : 0; }
            function addToBalance(amount, description = '') {
                const user = getCurrentUser();
                if (!user) return false;
                const newBalance = Math.max(0, user.balance + amount);
                const transactions = [...user.transactions];
                transactions.unshift({ type: amount >= 0 ? 'win' : 'bet', amount, date: Date.now(), description: description || (amount >= 0 ? 'Gain' : 'Mise') });
                if (transactions.length > 100) transactions.length = 100;
                return updateUser({ balance: newBalance, transactions });
            }
            function updateStats({ wagered = 0, profit = 0, won = false }) {
                const user = getCurrentUser();
                if (!user) return false;
                const stats = {
                    totalWagered: user.stats.totalWagered + wagered,
                    totalProfit: user.stats.totalProfit + profit,
                    gamesPlayed: user.stats.gamesPlayed + 1,
                    wins: user.stats.wins + (won ? 1 : 0),
                    losses: user.stats.losses + (won ? 0 : 1)
                };
                return updateUser({ stats });
            }
            return { register, login, logout, getCurrentUser, isLoggedIn, updateUser, getBalance, addToBalance, updateStats };
        })();

        // ============================================================
        // SYSTÈME VIP
        // ============================================================
        const VIP = (() => {
            // Définition des rangs VIP
            const RANKS = [
                {
                    id: 'bronze',
                    name: 'Bronze',
                    icon: '🥉',
                    requiredWager: 0,
                    color: 'bronze',
                    perks: [
                        'Accès à tous les jeux',
                        'Support standard',
                        'Bonus de bienvenue'
                    ]
                },
                {
                    id: 'silver',
                    name: 'Argent',
                    icon: '🥈',
                    requiredWager: 1000,
                    color: 'silver',
                    perks: [
                        'Toutes les récompenses Bronze',
                        'Bonus mensuel 10 €',
                        'Rakeback 2%',
                        'Support prioritaire'
                    ]
                },
                {
                    id: 'gold',
                    name: 'Or',
                    icon: '🥇',
                    requiredWager: 5000,
                    color: 'gold',
                    perks: [
                        'Toutes les récompenses Argent',
                        'Bonus mensuel 25 €',
                        'Rakeback 3%',
                        'Level Up Bonus'
                    ]
                },
                {
                    id: 'platinum',
                    name: 'Platine',
                    icon: '💎',
                    requiredWager: 15000,
                    color: 'platinum',
                    perks: [
                        'Toutes les récompenses Or',
                        'Bonus hebdo 20 €',
                        'Rakeback 5%',
                        'Bonus quotidien 5 €'
                    ]
                },
                {
                    id: 'diamond',
                    name: 'Diamant',
                    icon: '💠',
                    requiredWager: 50000,
                    color: 'diamond',
                    perks: [
                        'Toutes les récompenses Platine',
                        'Bonus hebdo 50 €',
                        'Rakeback 7%',
                        'Cadeaux VIP'
                    ]
                },
                {
                    id: 'legend',
                    name: 'Légende',
                    icon: '👑',
                    requiredWager: 150000,
                    color: 'legend',
                    perks: [
                        'Toutes les récompenses Diamant',
                        'Hôte VIP dédié',
                        'Rakeback 10%',
                        'Invitations événements'
                    ]
                }
            ];

            // Obtenir le rang actuel d'un utilisateur
            function getCurrentRank() {
                const user = ZinoAuth.getCurrentUser();
                if (!user) return null;
                const wagered = user.stats.totalWagered || 0;

                let currentRank = RANKS[0];
                for (const rank of RANKS) {
                    if (wagered >= rank.requiredWager) {
                        currentRank = rank;
                    } else {
                        break;
                    }
                }
                return currentRank;
            }

            // Obtenir le prochain rang
            function getNextRank() {
                const user = ZinoAuth.getCurrentUser();
                if (!user) return null;
                const wagered = user.stats.totalWagered || 0;

                for (const rank of RANKS) {
                    if (wagered < rank.requiredWager) {
                        return rank;
                    }
                }
                return null; // Déjà au rang max
            }

            // Progression vers le prochain rang (0-100%)
            function getProgressToNextRank() {
                const user = ZinoAuth.getCurrentUser();
                if (!user) return 0;
                const wagered = user.stats.totalWagered || 0;
                const current = getCurrentRank();
                const next = getNextRank();

                if (!next) return 100; // Rang max atteint

                const currentMin = current.requiredWager;
                const nextMin = next.requiredWager;
                const progress = ((wagered - currentMin) / (nextMin - currentMin)) * 100;
                return Math.max(0, Math.min(100, progress));
            }

            // Obtenir tous les rangs avec état (atteint ou non)
            function getAllRanks() {
                const user = ZinoAuth.getCurrentUser();
                const wagered = user ? (user.stats.totalWagered || 0) : 0;
                const currentRank = getCurrentRank();

                return RANKS.map(rank => ({
                    ...rank,
                    reached: wagered >= rank.requiredWager,
                    isCurrent: currentRank ? currentRank.id === rank.id : false
                }));
            }

            // Récupérer un bonus VIP
            function claimBonus(bonusId, amount, description) {
                const user = ZinoAuth.getCurrentUser();
                if (!user) return { success: false, error: 'Non connecté' };

                // Vérifier si déjà récupéré
                if (!user.vip) user.vip = { claimedBonuses: [] };
                if (user.vip.claimedBonuses.includes(bonusId)) {
                    return { success: false, error: 'Bonus déjà récupéré' };
                }

                // Ajouter le bonus
                user.vip.claimedBonuses.push(bonusId);
                ZinoAuth.updateUser({ vip: user.vip });
                ZinoAuth.addToBalance(amount, description || `Bonus VIP +${amount} €`);

                return { success: true, amount };
            }

            return {
                getCurrentRank,
                getNextRank,
                getProgressToNextRank,
                getAllRanks,
                claimBonus,
                RANKS
            };
        })();

        // ============================================================
        // CONFETTIS
        // ============================================================
        function launchConfetti() {
            const container = document.getElementById('confettiContainer');
            container.classList.add('active');
            container.innerHTML = '';
            const colors = ['#FFD700', '#FFA94D', '#00E701', '#1475E1', '#FFFFFF'];
            for (let i = 0; i < 80; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + '%';
                conf.style.background = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDelay = Math.random() * 0.5 + 's';
                conf.style.animationDuration = (2 + Math.random() * 2) + 's';
                conf.style.width = (5 + Math.random() * 10) + 'px';
                conf.style.height = (5 + Math.random() * 10) + 'px';
                container.appendChild(conf);
            }
            setTimeout(() => container.classList.remove('active'), 4000);
        }

        // ============================================================
        // RENDU
        // ============================================================
        function render() {
            const app = document.getElementById('app');
            const user = ZinoAuth.getCurrentUser();

            if (!user) {
                app.innerHTML = `
                    <div class="not-logged">
                        <div class="icon">🔒</div>
                        <h2>Vous n'êtes pas connecté</h2>
                        <p>Connectez-vous pour accéder au programme VIP.</p>
                        <a href="index.html">← Retour à l'accueil</a>
                    </div>
                `;
                return;
            }

            document.getElementById('headerBalance').textContent = user.balance.toFixed(2);

            const currentRank = VIP.getCurrentRank();
            const nextRank = VIP.getNextRank();
            const progress = VIP.getProgressToNextRank();
            const allRanks = VIP.getAllRanks();
            const wagered = user.stats.totalWagered || 0;

            // Barre de progression vers le prochain rang
            let nextRankSection = '';
            if (nextRank) {
                const remaining = nextRank.requiredWager - wagered;
                nextRankSection = `
                    <div class="next-rank-bar">
                        <div class="next-rank-labels">
                            <span class="current">${currentRank.icon} ${currentRank.name}</span>
                            <span class="next">${nextRank.icon} ${nextRank.name}</span>
                        </div>
                        <div class="progress-bar-track">
                            <div class="progress-bar-fill" style="width: ${progress}%;"></div>
                        </div>
                        <div class="next-rank-percent">
                            <strong>${progress.toFixed(1)}%</strong> — Encore <strong>${remaining.toLocaleString('fr-FR')} €</strong> à miser pour atteindre <strong>${nextRank.name}</strong>
                        </div>
                    </div>
                `;
            } else {
                nextRankSection = `
                    <div class="next-rank-bar">
                        <div class="next-rank-labels">
                            <span class="current">${currentRank.icon} ${currentRank.name}</span>
                            <span class="next">🌟 Rang maximum atteint !</span>
                        </div>
                        <div class="progress-bar-track">
                            <div class="progress-bar-fill" style="width: 100%;"></div>
                        </div>
                        <div class="next-rank-percent">
                            🎉 Vous êtes au sommet !
                        </div>
                    </div>
                `;
            }

            // Cartes des rangs
            const ranksHtml = allRanks.map(rank => {
                let cardClass = '';
                if (rank.isCurrent) cardClass = 'current';
                else if (!rank.reached) cardClass = 'locked';

                const perksHtml = rank.perks.map(perk => {
                    const isReached = rank.reached;
                    return `<li class="${isReached ? '' : 'locked-perk'}">
                        <span class="check">${isReached ? '✓' : '🔒'}</span>
                        <span>${perk}</span>
                    </li>`;
                }).join('');

                return `
                    <div class="rank-card ${cardClass}">
                        <div class="rank-card-icon ${rank.color}">${rank.icon}</div>
                        <div class="rank-card-name ${rank.color}">${rank.name}</div>
                        <div class="rank-card-wager">
                            ${rank.requiredWager === 0 ? 'Dès l\'inscription' : `<strong>${rank.requiredWager.toLocaleString('fr-FR')} €</strong> misés`}
                        </div>
                        <ul class="rank-card-perks">
                            ${perksHtml}
                        </ul>
                    </div>
                `;
            }).join('');

            app.innerHTML = `
                <div class="page-header">
                    <h1>👑 Programme <span class="highlight">VIP</span></h1>
                    <p>Misez pour monter en rang et débloquer des récompenses exclusives</p>
                </div>

                <div class="my-rank-card">
                    <div class="my-rank-content">
                        <div class="rank-badge ${currentRank.color}">
                            ${currentRank.icon}
                        </div>
                        <div class="my-rank-info">
                            <div class="my-rank-label">Votre rang actuel</div>
                            <div class="my-rank-name">
                                ${currentRank.name}
                                <span class="tag">Niveau ${allRanks.findIndex(r => r.id === currentRank.id) + 1}/6</span>
                            </div>
                            <div class="my-rank-wagered">
                                Total misé : <strong>${wagered.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €</strong>
                            </div>
                        </div>
                    </div>
                    ${nextRankSection}
                </div>

                <div class="ranks-section">
                    <div class="section-title">Tous les rangs</div>
                    <div class="ranks-grid">
                        ${ranksHtml}
                    </div>
                </div>
            `;
        }

        // ============================================================
        // INIT
        // ============================================================
        render();
    </script>
</body>
</html>
